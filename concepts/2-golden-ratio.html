<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 2 - Golden Ratio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Outfit', sans-serif; }
        .preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
        svg { width: 120px; height: 120px; overflow: visible; margin-bottom: 30px; }
        .circle { fill: none; stroke: #D4AF37; stroke-width: 1; stroke-dasharray: 400; stroke-dashoffset: 400; }
        .logo-text { font-size: 1.8rem; font-weight: 300; color: #D4AF37; letter-spacing: 0.3em; opacity: 0; text-transform: uppercase; margin-right: -0.3em; }
        @media (max-width: 768px) {
            svg { width: 80px; height: 80px; margin-bottom: 20px; }
            .logo-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="preloader">
        <svg viewBox="0 0 100 100">
            <circle class="circle" cx="50" cy="50" r="45"></circle>
            <circle class="circle inner" cx="50" cy="50" r="25"></circle>
            <line class="circle" x1="50" y1="5" x2="50" y2="95"></line>
        </svg>
        <div class="logo-text">1618 DIGITAL</div>
    </div>
    <div style="padding:50px; color:#fff; text-align:center; display: flex; align-items: center; justify-content: center; height: 100%;">
        <h1>1618 DIGITAL Web Sitesi (Animasyon Bitti)</h1>
    </div>
    <script>
        const tl = gsap.timeline();
        tl.to(".circle", { duration: 2, strokeDashoffset: 0, ease: "power2.inOut", stagger: 0.3, delay: 0.5 })
          .to(".circle", { duration: 1, fill: "rgba(212, 175, 55, 0.05)", ease: "power2.out" }, "-=0.5")
          .to(".logo-text", { duration: 1.5, opacity: 1, y: -10, ease: "power2.out" }, "-=1")
          .to(".preloader", { duration: 1.5, opacity: 0, scale: 1.5, ease: "power3.inOut", delay: 1 })
          .set(".preloader", { display: "none" });
    </script>
</body>
</html>
