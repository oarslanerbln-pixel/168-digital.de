<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 3 - Fluid Glassmorphism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Montserrat', sans-serif; }
        .preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; overflow: hidden; }
        .gradient-sphere { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; background: radial-gradient(circle, rgba(168,20,20,0.5) 0%, rgba(0,0,0,0) 70%); filter: blur(60px); opacity: 0; mix-blend-mode: screen; }
        .sphere-1 { top: -20%; left: -10%; }
        .sphere-2 { bottom: -20%; right: -10%; background: radial-gradient(circle, rgba(212,175,55,0.4) 0%, rgba(0,0,0,0) 70%); }
        .glass-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; height: 150px; background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; border-radius: 20px; opacity: 0; }
        .logo-text { font-size: 2rem; font-weight: 300; color: #fff; letter-spacing: 0.3em; margin-right: -0.3em; text-transform: uppercase; background: linear-gradient(90deg, #ffffff, #888888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @media (max-width: 768px) {
            .gradient-sphere { width: 100vw; height: 100vw; }
            .glass-panel { width: 85%; height: 120px; }
            .logo-text { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="preloader">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="glass-panel">
            <div class="logo-text">1618 DIGITAL</div>
        </div>
    </div>
    <div style="padding:50px; color:#fff; text-align:center; display: flex; align-items: center; justify-content: center; height: 100%;">
        <h1>1618 DIGITAL Web Sitesi (Animasyon Bitti)</h1>
    </div>
    <script>
        const tl = gsap.timeline();
        tl.to(".gradient-sphere", { duration: 2, opacity: 1, ease: "power2.inOut" })
          .to(".sphere-1", { duration: 5, x: "20vw", y: "20vh", ease: "sine.inOut", repeat: -1, yoyo: true }, 0)
          .to(".sphere-2", { duration: 5, x: "-20vw", y: "-20vh", ease: "sine.inOut", repeat: -1, yoyo: true }, 0)
          .to(".glass-panel", { duration: 1.5, opacity: 1, y: -20, ease: "power3.out" }, 0.5)
          .to(".glass-panel", { duration: 1, scale: 1.1, opacity: 0, ease: "power2.in" }, 3.5)
          .to(".gradient-sphere", { duration: 1.5, opacity: 0, scale: 1.5, ease: "power2.in" }, 3.5)
          .to(".preloader", { duration: 0.5, opacity: 0 }, 4.5)
          .set(".preloader", { display: "none" });
    </script>
</body>
</html>
