<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary Meta Tags

         These static tags are what any crawler or link-preview bot sees
         BEFORE JavaScript runs — this is a client-rendered SPA with no
         SSR/prerendering (vercel.json rewrites every route to this same
         index.html), so a bot that doesn't execute JS never sees anything
         else. SEOHead.tsx then overwrites these client-side once React
         mounts, using the matching i18n meta_title/meta_description keys
         for the homepage — kept in sync with those keys by hand, since
         nothing enforces it automatically. -->
    <title>1618 Digital | Web & Video Production Studio, Berlin</title>
    <meta name="title" content="1618 Digital | Web & Video Production Studio, Berlin" />
    <meta name="description" content="Berlin studio for custom websites, SaaS platforms, cinematic video, drone footage, and social media content that grows your brand." />
    <meta name="keywords" content="1618 Digital, Video Production, Berlin Tech, video çekimi, düğün video çekimleri, sinematik fotoğraf, düğün fotoğrafçısı, şirketlere drone çekimi, web development" />
    <meta name="author" content="Ömer Arslaner" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://1618-digital.de/" />

    <!-- hreflang for multilingual SEO -->
    <link rel="alternate" hreflang="en" href="https://1618-digital.de/?lang=en" />
    <link rel="alternate" hreflang="de" href="https://1618-digital.de/?lang=de" />
    <link rel="alternate" hreflang="tr" href="https://1618-digital.de/?lang=tr" />
    <link rel="alternate" hreflang="x-default" href="https://1618-digital.de/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://1618-digital.de/" />
    <meta property="og:title" content="1618 Digital | Web & Video Production Studio, Berlin" />
    <meta property="og:description" content="Berlin studio for custom websites, SaaS platforms, cinematic video, drone footage, and social media content that grows your brand." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="1618 Digital — Berlin digital studio for web and cinematic production" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="tr_TR" />

    <!-- Twitter -->

    <meta property="twitter:url" content="https://1618-digital.de/" />
    <meta property="twitter:title" content="1618 Digital | Web & Video Production Studio, Berlin" />
    <meta property="twitter:description" content="Berlin studio for custom websites, SaaS platforms, cinematic video, drone footage, and social media content that grows your brand." />
    <meta property="twitter:image" content="/og-image.png" />
    <meta property="twitter:image:alt" content="1618 Digital — Berlin digital studio for web and cinematic production" />

    <!-- Geo Meta (Local SEO for Berlin) -->
    <meta name="geo.region" content="DE-BE" />
    <meta name="geo.placename" content="Berlin" />
