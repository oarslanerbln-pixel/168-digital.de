name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # vite build, then scripts/prerender.mjs — the same two steps
      # `npm run build` chains for a real deploy. Split out (rather than
      # just running `npm run build`) so tsc above isn't repeated. This is
      # also where the postinstall Chromium fetch (best-effort, see
      # package.json) actually gets exercised: if that fetch failed,
      # prerender.mjs's own browser launch fails loudly right here.
      - run: npx vite build && node scripts/prerender.mjs
      - run: npm test
