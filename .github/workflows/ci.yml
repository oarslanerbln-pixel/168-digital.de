name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The full build: client bundle, SSR bundle and the per-route
      # prerender, so a page that fails to render fails the PR, not the deploy.
      - run: npm run build
      - run: npm test
